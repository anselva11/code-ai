[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-ai-agents"
version = "0.1.0"
description = "Autonomous Financial Intelligence & Quantitative Research System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "AXIOM Team"}
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.5.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "httpx>=0.25.0",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "yfinance>=0.2.30",
    "feedparser>=6.0.10",
    "textual>=8.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
axiom = "axiom.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
